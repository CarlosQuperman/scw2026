<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 수시 지원 상담카드 (자동채움)</title>
<style>
:root { --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2933; --muted:#667085; --line:#d7dde5; --line-strong:#aab4c2; --navy:#17456b; --soft-blue:#e8f1f8; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif; font-size:14px; }
header { background:linear-gradient(115deg,#173f5f 0%,#1f6f78 100%); color:#fff; padding:18px 24px; }
header h1 { margin:0; font-size:21px; }
header p { margin:6px 0 0; color:rgba(255,255,255,.85); font-size:13px; }
main { max-width:1480px; margin:0 auto; padding:16px 18px 40px; }
.panel-head { margin:0 0 10px; }
.panel-head h2 { margin:0 0 4px; font-size:17px; color:var(--navy); }
.panel-head span { color:var(--muted); font-size:13px; line-height:1.5; }
input, select { font-family:inherit; }

    /* ==================== 상담카드 탭 ==================== */
    .card-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
    .card-toolbar button { border:1px solid var(--line-strong); background:#fff; border-radius:7px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink); }
    .card-toolbar button.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
    .card-toolbar button:hover { filter:brightness(.96); }
    .card-toolbar .card-hint { color:var(--muted); font-size:12px; }
    .card-sheet { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 16px; overflow-x:auto; }
    .card-inner { min-width:1330px; }
    .card-title { text-align:center; font-size:22px; font-weight:800; letter-spacing:2px; margin:0 0 8px; color:#000; }
    .card-idrow { display:flex; justify-content:flex-end; gap:4px; align-items:center; font-size:13px; font-weight:700; margin:0 0 8px; color:#000; }
    .card-idrow input { width:76px; height:20px; min-height:0; border:none; border-radius:0; border-bottom:1px solid #888; text-align:center; font-size:13px; padding:2px 2px; background:transparent; }
    .card-sec-label { font-size:13.5px; font-weight:800; margin:8px 0 5px; color:#000; }
    table.card-info { width:100%; border-collapse:collapse; table-layout:fixed; margin-bottom:12px; }
    table.card-info th, table.card-info td { border:1px solid #444; font-size:12.5px; padding:4px 6px; color:#000; }
    table.card-info th { background:#f1f3f5; font-weight:700; text-align:center; white-space:nowrap; }
    table.card-info input { width:100%; height:20px; min-height:0; border:none; border-radius:0; font-size:12.5px; padding:1px 2px; background:transparent; color:#000; }
    .card-ox { display:inline-block; min-width:36px; text-align:center; cursor:pointer; border-bottom:1px dashed #b0b8c1; font-weight:800; font-size:13px; line-height:1.2; user-select:none; color:#17456b; }
    .card-ox:hover { background:#eef4fa; }
    table.card-main { width:100%; border-collapse:collapse; table-layout:fixed; }
    table.card-main th, table.card-main td { border:1px solid #444; font-size:11.5px; padding:2px 3px; text-align:center; vertical-align:middle; color:#000; word-break:break-all; }
    table.card-main thead th { background:#f1f3f5; font-weight:700; font-size:11.5px; line-height:1.25; padding:4px 2px; }
    table.card-main input { width:100%; height:18px; min-height:0; border:none; border-radius:0; font-size:11.5px; text-align:center; padding:1px; background:transparent; color:#000; }
    table.card-main .card-ce { min-height:15px; outline:none; font-size:11px; line-height:1.3; text-align:center; white-space:pre-wrap; }
    table.card-main .card-typecell { padding:0; }
    table.card-main select.card-kind { width:100%; height:18px; min-height:0; border:none; border-radius:0; background:transparent; font-size:11px; text-align:center; text-align-last:center; appearance:none; -webkit-appearance:none; padding:1px; color:#000; cursor:pointer; }
    table.card-main .card-typecell .card-ce { padding:2px 3px; }
    table.card-main .card-typecell .tk { border-bottom:1px solid #888; font-weight:600; }
    .card-rowgroup { break-inside:avoid; page-break-inside:avoid; }
    .card-stage-label { background:#fafbfc; font-size:10.5px; white-space:nowrap; }
    .card-strat { cursor:pointer; user-select:none; font-size:10.5px; white-space:nowrap; color:#777; }
    .card-strat.picked { color:#000; font-weight:800; }
    .card-strat.picked::before { content:'● '; }
    .card-clear-row { border:none; background:transparent; color:#b44b5f; cursor:pointer; font-size:11px; padding:0; display:block; margin:2px auto 0; }
    .card-notes { font-size:11.5px; color:#000; margin:8px 0 0; line-height:1.5; }
    .card-notes p { margin:0; }
    .card-ac-box { position:absolute; z-index:9999; background:#fff; border:1px solid var(--line-strong); border-radius:6px; box-shadow:0 8px 20px rgba(31,41,51,.18); max-height:340px; overflow-y:auto; min-width:200px; display:none; overscroll-behavior:contain; }
    .card-ac-box::-webkit-scrollbar { width:14px; }
    .card-ac-box::-webkit-scrollbar-track { background:#f2f5f8; border-radius:0 6px 6px 0; }
    .card-ac-box::-webkit-scrollbar-thumb { background:#a9b8c6; border-radius:7px; border:3px solid #f2f5f8; min-height:40px; }
    .card-ac-box::-webkit-scrollbar-thumb:hover { background:#7f93a6; }
    .card-ac-item { padding:7px 10px; font-size:12.5px; cursor:pointer; text-align:left; display:flex; justify-content:space-between; gap:10px; }
    .card-ac-item .ac-meta { color:var(--muted); font-size:11px; flex:0 0 auto; }
    .card-ac-item:hover, .card-ac-item.hover, .card-ac-item.active { background:var(--soft-blue); }
    .card-ac-count { position:sticky; top:0; background:#f7fafc; color:var(--muted); font-size:10.5px; padding:3px 10px; border-bottom:1px solid var(--line-strong); text-align:right; letter-spacing:.02em; }
    .card-filled { background:#f4f9f4; }
    .card-examcell .card-ce { text-align:left; }
    .card-date-dup { color:#c0141e; font-weight:800; text-decoration:underline; }
    /* ---- 3단계: 불러오기 상태 · 성적 분석 · 제출 ---- */
    #loadBar { display:none; position:sticky; top:0; z-index:50; background:#fff8e1; color:#5f4b00; border-bottom:1px solid #f1d27a; padding:8px 24px; font-size:13px; font-weight:600; }
    #loadBar.on { display:block; }
    #loadBar.err { background:#fdecea; color:#8a1c12; border-color:#f2b8b0; }
    .card-strat.suggest { outline:2px dashed #1f6f78; outline-offset:-3px; }
    .an-wrap { margin:12px 0 4px; }
    .an-note { font-size:11.5px; color:#444; margin:0 0 5px; line-height:1.5; }
    table.an-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    table.an-table th, table.an-table td { border:1px solid #444; font-size:11.5px; padding:3px 5px; text-align:center; color:#000; word-break:keep-all; }
    table.an-table th { background:#f1f3f5; }
    table.an-table td.l { text-align:left; }
    .v-안정 { color:#1b6b3a; font-weight:800; } .v-적정 { color:#17456b; font-weight:800; }
    .v-상향 { color:#a15c00; font-weight:800; } .v-소신 { color:#b3261e; font-weight:800; }
    .ok { color:#1b6b3a; font-weight:700; } .no { color:#b3261e; font-weight:700; } .na { color:#777; }
    #cardSubmitMsg.okmsg { color:#1b6b3a; font-weight:700; } #cardSubmitMsg.errmsg { color:#b3261e; font-weight:700; }
    @media print {
      body.print-card header, body.print-card .metrics, body.print-card .tabbar, body.print-card #scorePanel,
      body.print-card #directoryPanel, body.print-card #jsRegionPanel, body.print-card #deptPanel,
      body.print-card #comparePanel, body.print-card #qualPanel, body.print-card #fitPanel,
      body.print-card #universitySummaryPanel, body.print-card #workspace, body.print-card .no-print { display:none !important; }
      body.print-card main { max-width:none; padding:0; margin:0; }
      body.print-card #cardPanel { display:block !important; box-shadow:none; border:none; padding:0; margin:0; background:#fff; }
      body.print-card .card-sheet { border:none; border-radius:0; padding:0; overflow:visible; }
      body.print-card .card-inner { min-width:0; }
      body.print-card .card-title { font-size:19px; }
      body.print-card table.card-info th, body.print-card table.card-info td { border:1px solid #000; font-size:10.5px; padding:3px 4px; }
      body.print-card table.card-info th { background:#eceff1 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body.print-card table.card-main th, body.print-card table.card-main td { border:1px solid #000; font-size:9px; padding:1.5px 2px; }
      body.print-card table.card-main thead th { background:#eceff1 !important; font-size:9px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body.print-card table.card-main input { height:13px; font-size:9px; }
      body.print-card table.card-main select.card-kind { height:13px; font-size:9px; }
      body.print-card table.card-info input { height:15px; font-size:10.5px; }
      body.print-card .card-ox { border-bottom:none; color:#000; font-size:11px; }
      body.print-card table.card-main .card-ce { font-size:8.5px; min-height:11px; }
      body.print-card table.card-main .card-stage-label, body.print-card table.card-main .card-strat { font-size:8.5px; }
      body.print-card .card-filled { background:#fff; }
      body.print-card .card-strat { color:#333; }
      body.print-card .card-date-dup { color:#c0141e !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body.print-card table.card-main thead { display:table-header-group; }
    }
    /* ---- 담임교사 상담 기록 ---- */
    table.card-teacher { margin-bottom:4px; }
    table.card-teacher th { white-space:normal; }
    table.card-teacher td { vertical-align:middle; }
    table.card-teacher .card-tce { min-height:46px; outline:none; font-size:12.5px; line-height:1.5; text-align:left; white-space:pre-wrap; padding:3px 5px; color:#000; }
    table.card-teacher input { text-align:center; }
    table.card-teacher tr { break-inside:avoid; page-break-inside:avoid; }
    .card-teacher-wrap { break-inside:avoid; page-break-inside:avoid; margin-top:14px; }
    body.print-card table.card-teacher .card-tce { min-height:52px; font-size:10px; }
    /* ==================== /상담카드 탭 ==================== */

@media print { header { display:none !important; } body { background:#fff; } main { max-width:none; padding:0; } }
</style>

<body>
<header class="no-print">
  <h1>2027학년도 대입전형 수시 지원 상담카드 (자동채움)</h1>
  <p>대학명 → 전형명 → 학과명을 입력하면 나머지 칸이 자동으로 채워집니다. 자료에 없는 대학(과학기술원 등)은 직접 입력하면 됩니다. 작성 내용은 이 컴퓨터 브라우저에 자동 저장되고, ‘교사에게 제출’을 누르면 담임 선생님 시트에 기록됩니다. <span style="opacity:.85;">· 제작: 운정고등학교 이재규</span></p>
</header>
<div id="loadBar" class="no-print" role="status" aria-live="polite"></div>
<main>
  <section id="cardPanel"></section>
</main>
<script>
(function () {
  'use strict';
  /* ===== 3단계: 자료는 HTML에 넣지 않고 교사 드라이브의 JSON에서 필요한 만큼만 불러온다 =====
     · 시작할 때: 대학 목록 + 고사일(sched.json)
     · 대학을 고를 때: 그 대학 파일 하나(예: 경북대.json)만                                    */
  let BOOT = { unis: [] };
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      if (!(window.google && google.script && google.script.run)) {
        reject(new Error('앱스크립트 웹 앱 주소(…/exec)로 열어야 자료를 불러오고 제출할 수 있다.'));
        return;
      }
      const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  function setStatus(msg, isErr) {
    const b = document.getElementById('loadBar');
    if (!b) return;
    b.textContent = msg || '';
    b.className = msg ? ('on' + (isErr ? ' err' : '')) : '';
  }
  const favorites = [];
  const el = id => document.getElementById(id);
  const text = value => value === null || value === undefined ? '' : String(value);
  const norm = value => text(value).toLowerCase();
  const loose = value => norm(value).replace(/[\s\-_/()\[\].,·・]/g, '');
  const escapeHtml = value => text(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escapeAttr = value => escapeHtml(value).replace(/"/g, '&quot;');

    let CARD_SCHED = [];   // 3단계: 드라이브의 sched.json에서 불러옴

    // ==================== 상담카드 탭 ====================
    const CARD_KEY = 'ddyjd_card_student_v1';
    const CARD_ROWS = 12;
    const CARD_TCH_ROWS = 3;
    const CARD_ELEMS = ['학생부', '서류', '면접', '적성', '논술', '실기'];
    let cardState = null;
    let cardBuilt = false;
    let cardByUni = null;
    let cardUniNames = null;
    let cardSaveTimer = null;

    function cardBlankStages() { return [{ ratio: '', pct: { 학생부: '', 서류: '', 면접: '', 적성: '', 논술: '', 실기: '' } }, { ratio: '', pct: { 학생부: '', 서류: '', 면접: '', 적성: '', 논술: '', 실기: '' } }, { ratio: '', pct: { 학생부: '', 서류: '', 면접: '', 적성: '', 논술: '', 실기: '' } }]; }
    function cardBlankRow() { return { uni: '', major: '', typeName: '', typeKind: '', quota: '', comp: '', avg: '', conv: '', exam: '', minreq: '', minreqFull: '', stages: cardBlankStages(), strategy: '', filledKey: '', c50: '', c70: '', cavg: '' }; }
    function cardDefaultState() {
      const header = {};
      ['hakbun', 'name', 'naeshin', 'm_kor', 'm_math', 'm_eng', 'm_t1', 'm_t2', 'm_hist', 'jinro', 'hgwa', 'banghakjung', 'bangakhu', 'jeonmun', 'univ4', 'susi', 'jeongsi', 'gyogwa', 'jonghap', 'jukseong', 'nonsul', 'silgi', 'gita'].forEach(k => header[k] = '');
      const teacher = { rows: Array.from({ length: CARD_TCH_ROWS }, () => ({ d: '', c: '', s: '' })), final: '' };
      return { header, rows: Array.from({ length: CARD_ROWS }, cardBlankRow), teacher };
    }
    function cardLoad() {
      if (cardState) return;
      cardState = cardDefaultState();
      try {
        const saved = JSON.parse(localStorage.getItem(CARD_KEY));
        if (saved && saved.rows) {
          Object.assign(cardState.header, saved.header || {});
          for (let i = 0; i < CARD_ROWS; i++) {
            if (saved.rows[i]) {
              const b = cardBlankRow();
              Object.keys(b).forEach(k => { if (k !== 'stages' && saved.rows[i][k] != null) b[k] = saved.rows[i][k]; });
              if (Array.isArray(saved.rows[i].stages)) for (let s = 0; s < 3; s++) if (saved.rows[i].stages[s]) {
                b.stages[s].ratio = text(saved.rows[i].stages[s].ratio);
                Object.assign(b.stages[s].pct, saved.rows[i].stages[s].pct || {});
              }
              cardState.rows[i] = b;
            }
          }
          if (saved.teacher) {
            const tb = cardState.teacher;
            if (Array.isArray(saved.teacher.rows)) for (let i = 0; i < CARD_TCH_ROWS; i++) if (saved.teacher.rows[i]) {
              ['d', 'c', 's'].forEach(k => { if (saved.teacher.rows[i][k] != null) tb.rows[i][k] = text(saved.teacher.rows[i][k]); });
            }
            if (saved.teacher.final != null) tb.final = text(saved.teacher.final);
          }
        }
      } catch (e) {}
    }
    function cardSaveNow() { if (!cardState) return; try { localStorage.setItem(CARD_KEY, JSON.stringify(cardState)); } catch (e) {} }
    function cardSave() {
      clearTimeout(cardSaveTimer);
      cardSaveTimer = setTimeout(() => { cardSaveNow(); renderAnalysis(); }, 250);
    }
    window.addEventListener('beforeunload', cardSaveNow);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') cardSaveNow(); });
    function buildCardIndex() {
      if (cardByUni) return;
      cardByUni = new Map();                       // 불러온 대학만 채워진다
      cardUniNames = (BOOT.unis || []).slice().sort((a, b) => a.localeCompare(b, 'ko'));
    }
    const uniPending = new Map();
    function uniResolve(name) {
      buildCardIndex();
      const t = text(name).trim();
      if (!t) return '';
      if (cardUniNames.indexOf(t) !== -1) return t;
      const l = loose(t);
      return cardUniNames.find(u => loose(u) === l) || '';
    }
    function ensureUni(uni, cb) {
      buildCardIndex();
      if (!uni) return;
      if (cardByUni.has(uni)) { if (cb) cb(); return; }
      if (uniPending.has(uni)) { if (cb) uniPending.get(uni).push(cb); return; }
      uniPending.set(uni, cb ? [cb] : []);
      setStatus(uni + ' 자료를 불러오는 중…');
      call('getUni', uni).then(txt => {
        const o = typeof txt === 'string' ? JSON.parse(txt) : txt;
        const list = o.rows.map(a => { const r = {}; o.cols.forEach((c, i) => { if (a[i] !== null && a[i] !== undefined) r[c] = a[i]; }); return r; });
        cardByUni.set(uni, list);
        setStatus('');
        const cbs = uniPending.get(uni) || [];
        uniPending.delete(uni);
        cbs.forEach(f => f());
      }).catch(err => {
        uniPending.delete(uni);
        setStatus(uni + ' 자료를 불러오지 못했다: ' + (err && err.message ? err.message : err), true);
      });
    }
    function cardIsSubseq(q, s) { let i = 0; for (const ch of s) { if (ch === q[i]) i++; if (i === q.length) return true; } return q.length === 0; }
    function cardAcRank(q, list) {
      const lq = loose(q);
      if (!lq) return list.slice(); // 검색어가 없으면 전체 목록 표시 (스크롤로 탐색)
      const starts = [], sub = [], seq = [];
      for (const item of list) {
        const ls = loose(typeof item === 'string' ? item : item.v);
        if (ls.startsWith(lq)) starts.push(item);
        else if (ls.includes(lq)) sub.push(item);
        else if (lq.length >= 2 && cardIsSubseq(lq, ls)) seq.push(item);
      }
      return starts.concat(sub, seq).slice(0, 60);
    }
    function cardRowsFor(uni, typeName, major) {
      buildCardIndex();
      let list = cardByUni.get(text(uni).trim()) || [];
      if (typeName) list = list.filter(r => text(r['전형명']).trim() === typeName);
      if (major) list = list.filter(r => text(r['학과명']).trim() === major);
      return list;
    }
    function cardTypeCands(uni, major) {
      let list = cardRowsFor(uni, '', major && cardRowsFor(uni, '', major).length ? major : '');
      const seen = new Map();
      list.forEach(r => { const t = text(r['전형명']).trim(); if (t && !seen.has(t)) seen.set(t, cardNormKind(r['전형유형'])); });
      return Array.from(seen.entries()).map(([v, m]) => ({ v, m }));
    }
    function cardMajorCands(uni, typeName) {
      let list = cardRowsFor(uni, typeName && cardRowsFor(uni, typeName).length ? typeName : '', '');
      const seen = new Map();
      list.forEach(r => { const t = text(r['학과명']).trim(); if (t && !seen.has(t)) seen.set(t, cardNormKind(r['전형유형'])); });
      return Array.from(seen.entries()).map(([v, m]) => ({ v, m }));
    }
    function cardNormKind(v) {
      const s = text(v).trim();
      if (!s) return '';
      if (s.indexOf('종합') !== -1) return '학생부종합';
      if (s.indexOf('교과') !== -1) return '학생부교과';
      if (s.indexOf('논술') !== -1) return '논술';
      if (s.indexOf('실기') !== -1 || s.indexOf('실적') !== -1) return '실기/실적';
      return s;
    }
    function cardParseMinreq(v) {
      const t = text(v).trim();
      if (!t) return { short: '', full: '' };
      if (t.length < 14 && /미반영|없음|해당\s*없음|^무$|^-+$|^X$|^x$/.test(t)) return { short: '없음', full: t };
      const m = t.match(/(\d)\s*개\s*(?:영역)?[^0-9]{0,24}?합\s*(\d{1,2})/);
      let short = m ? m[1] + '개합' + m[2] : '있음';
      if (!m) {
        const m2 = t.match(/(\d)\s*개\s*(?:영역|과목)?\s*1\s*등급/) || t.match(/1\s*등급\s*(\d)\s*개/);

    /* ===== 3단계: 내 성적으로 입결 위치 · 수능최저 충족 추정 =====
       · 대학별 환산등급은 대학마다 반영 교과·학년 비율이 달라 계산하지 않는다.
         학생이 '대학별 환산등급' 칸에 적으면 그 값을, 없으면 '내신성적'을 비교에 쓴다.
       · 기준(교사가 조정): 50%컷보다 SAFE_GAP 이상 좋으면 안정, 70%컷 이내면 적정,
         70%컷보다 REACH_GAP 이내로 나쁘면 상향, 그 밖은 소신                          */
    const SAFE_GAP = 0.3, REACH_GAP = 0.5;
    const num = v => { const x = parseFloat(text(v).replace(/[^0-9.]/g, '')); return Number.isFinite(x) ? x : NaN; };
    function judgeRow(row, myGrade) {
      if (!Number.isFinite(myGrade)) return { v: '', msg: '내 등급 입력 필요' };
      let c50 = num(row.c50), c70 = num(row.c70), cav = num(row.cavg);
      if (!Number.isFinite(c50) && !Number.isFinite(c70) && !Number.isFinite(cav)) {
        const a = num(row.avg); if (Number.isFinite(a)) cav = a;
      }
      const ref50 = Number.isFinite(c50) ? c50 : cav;
      const ref70 = Number.isFinite(c70) ? c70 : ref50;
      if (!Number.isFinite(ref50) && !Number.isFinite(ref70)) return { v: '', msg: '입결 없음' };
      if ((ref50 || ref70) > 9) return { v: '', msg: '점수형 입결(비교 불가)' };
      let v;
      if (Number.isFinite(ref50) && myGrade <= ref50 - SAFE_GAP) v = '안정';
      else if (myGrade <= ref70) v = '적정';
      else if (myGrade <= ref70 + REACH_GAP) v = '상향';
      else v = '소신';
      const note = row.typeKind === '학생부종합' ? '종합: 서류 비중 커 참고만' : '';
      return { v, msg: note, ref: (Number.isFinite(c50) ? c50 : '-') + ' / ' + (Number.isFinite(c70) ? c70 : (Number.isFinite(cav) ? '평균 ' + cav : '-')) };
    }
    function minCheck(full, h) {
      const t = text(full).trim();
      if (!t) return { cls: 'na', msg: '' };
      if (t.length < 30 && /미반영|^없음|해당\s*없음/.test(t)) return { cls: 'ok', msg: '최저 없음' };
      const g = k => { const x = num(h[k]); return x >= 1 && x <= 9 ? x : NaN; };
      const kor = g('m_kor'), math = g('m_math'), eng = g('m_eng'), t1 = g('m_t1'), t2 = g('m_t2'), hist = g('m_hist');
      if ([kor, math, eng, t1].some(x => !Number.isFinite(x))) return { cls: 'na', msg: '모의 등급 입력 시 추정' };
      let tam = Number.isFinite(t2) ? Math.min(t1, t2) : t1;
      if (/2\s*과목\s*평균/.test(t) && Number.isFinite(t2)) { tam = (t1 + t2) / 2; if (/버림|절사/.test(t)) tam = Math.floor(tam); }
      const multi = (t.match(/\d\s*개\s*(?:영역)?[^0-9]{0,24}?합\s*\d{1,2}/g) || []).length > 1;
      let ok = null;
      const m = t.match(/(\d)\s*개\s*(?:영역)?[^0-9]{0,24}?합\s*(\d{1,2})/);
      if (m) {
        let areas = [kor, math, eng, tam];
        if (/영어\s*(?:를|은)?\s*제외/.test(t)) areas = [kor, math, tam];
        const n = +m[1], lim = +m[2];
        const sum = areas.slice().sort((a, b) => a - b).slice(0, n).reduce((a, b) => a + b, 0);
        ok = sum <= lim;
      } else {
        const m2 = t.match(/(\d)\s*개\s*(?:영역|과목)?\s*1\s*등급/) || t.match(/1\s*등급\s*(\d)\s*개/);
        if (m2) ok = [kor, math, eng, tam].filter(x => x === 1).length >= +m2[1];
      }
      const em = t.match(/영어\s*(?:등급)?\s*(\d)\s*(?:등급)?\s*(?:이내|이하)/);
      if (em) ok = (ok === null ? true : ok) && eng <= +em[1];
      const hm = t.match(/한국사\s*(?:등급)?\s*(\d)\s*(?:등급)?\s*(?:이내|이하)/);
      if (hm && Number.isFinite(hist)) ok = (ok === null ? true : ok) && hist <= +hm[1];
      if (ok === null) return { cls: 'na', msg: '요강 확인' };
      return { cls: ok ? 'ok' : 'no', msg: (ok ? '충족' : '미충족') + '(추정)' + (multi ? ' · 계열별 기준 확인' : '') };
    }
    function analyzeRows() {
      const h = cardState.header;

        const conv = num(row.conv);

        out.push({ i, row, my, src: Number.isFinite(conv) ? '환산' : '내신', j, mc });
      });
      return out;
    }

        <tr><th>순</th><th>대학 · 학과 · 전형</th><th>입결 50% / 70%</th><th>비교 등급</th><th>입결 판정</th><th>수능최저</th><th>최저 충족</th></tr>${trs}</table></div>`;

    /* ===== 3단계: 교사에게 제출 → 교사 구글 시트에 누적 ===== */
    function submitCard() {
      const h = cardState.header;
      const msg = el('cardSubmitMsg'), btn = el('cardSubmitBtn');
      const say = (t, cls) => { msg.textContent = t; msg.className = 'card-hint ' + (cls || ''); };
      const id = text(h.hakbun).trim(), name = text(h.name).trim();
      if (!/^\d{4,6}$/.test(id)) { say('맨 위 학번 칸에 숫자 4~6자리를 적어 줘.', 'errmsg'); return; }
      if (!name) { say('맨 위 이름 칸을 채워 줘.', 'errmsg'); return; }
      const list = analyzeRows();
      if (!list.length) { say('지원 대학을 한 곳 이상 적어 줘.', 'errmsg'); return; }
      const payload = {
        studentId: id, name: name,
        header: { naeshin: h.naeshin, jinro: h.jinro, hgwa: h.hgwa, m_kor: h.m_kor, m_math: h.m_math, m_eng: h.m_eng, m_t1: h.m_t1, m_t2: h.m_t2, m_hist: h.m_hist },
        rows: list.map(a => ({
          no: a.i + 1, uni: a.row.uni, major: a.row.major, typeKind: a.row.typeKind, typeName: a.row.typeName,
          quota: a.row.quota, comp: a.row.comp, avg: a.row.avg, conv: a.row.conv,
          myGrade: Number.isFinite(a.my) ? a.my : '', verdict: a.j.v || a.j.msg,
          minreq: a.row.minreqFull || a.row.minreq, minOk: a.mc.msg, strategy: a.row.strategy, exam: a.row.exam
        }))
      };
      btn.disabled = true; say('제출하는 중…');
      call('submitCard', payload).then(res => {
        btn.disabled = false;
        say(`제출 완료 · ${res.count}개 지원 · ${res.attempt}회차 · ${res.time}`, 'okmsg');
      }).catch(err => {
        btn.disabled = false;
        say('제출하지 못했다: ' + (err && err.message ? err.message : err), 'errmsg');
      });
    }
    function cardClearRow(idx) {
      cardState.rows[idx] = cardBlankRow();
      cardRenderRow(idx);
      cardUpdateConflicts();
      cardSave();
    }
    function cardImportFavs() {
      if (!favorites.length) { alert('관심 비교 목록이 비어 있습니다. 상세표의 ♥ 버튼으로 먼저 담아 주세요.'); return; }
      let fi = 0;
      for (let i = 0; i < CARD_ROWS && fi < favorites.length; i++) {
        const row = cardState.rows[i];
        if (row.uni || row.major || row.typeName) continue;
        cardFillFromRow(i, favorites[fi++]);
      }
      if (fi < favorites.length) alert('빈 행이 부족하여 관심 목록 중 ' + fi + '개만 불러왔습니다.');
    }
    function cardPrint() {
      cardAcHide();
      document.body.classList.add('print-card');
      let st = el('cardPageStyle');
      if (!st) { st = document.createElement('style'); st.id = 'cardPageStyle'; document.head.appendChild(st); }
      st.textContent = '@page { size: A4 landscape; margin: 8mm; }';
      const cleanup = () => { document.body.classList.remove('print-card'); if (st.parentNode) st.parentNode.removeChild(st); window.removeEventListener('afterprint', cleanup); };
      window.addEventListener('afterprint', cleanup);
      window.print();
      setTimeout(cleanup, 1500);
    }
    function renderCard() {
      const panel = el('cardPanel');
      if (!panel) return;
      cardLoad();
      buildCardIndex();
      if (!cardBuilt) {
        panel.innerHTML = `
          <div class="panel-head no-print">
            <h2>수시 지원 상담카드</h2>
            <span>대학명 → 전형명 → 학과명 순으로 입력하면 나머지 칸이 자동으로 채워집니다. 모든 칸은 직접 고쳐 쓸 수 있고, 자료에 없는 대학(과학기술원 등)은 그냥 손으로 적으면 됩니다. 입력 내용은 이 컴퓨터에 자동 저장됩니다.</span>
          </div>
          <div class="card-toolbar no-print">
            <button type="button" class="primary" id="cardPrintBtn">인쇄 / PDF 저장 (A4 가로)</button>
            <button type="button" id="cardImportBtn">관심 비교 목록 불러오기</button>
            <button type="button" id="cardResetBtn">전체 지우기</button>
            <button type="button" class="primary" id="cardSubmitBtn">교사에게 제출</button>
            <span id="cardSubmitMsg" class="card-hint"></span>
            <span class="card-hint">자동 채움 값(경쟁률·등급·반영비율 등)은 참고용이니 모집요강으로 최종 확인하세요.</span>
          </div>
          <div class="card-sheet"><div class="card-inner">${cardHeaderHtml()}${cardTableHtml()}<div id="anPanel"></div>${cardTeacherHtml()}</div></div>`;
        cardBuilt = true;
        el('cardPrintBtn').addEventListener('click', cardPrint);
        el('cardImportBtn').addEventListener('click', cardImportFavs);
        el('cardSubmitBtn').addEventListener('click', submitCard);
        el('cardResetBtn').addEventListener('click', () => { if (confirm('상담카드 내용을 모두 지울까요?')) { cardState = cardDefaultState(); cardRefreshAll(); cardSave(); } });
        panel.addEventListener('input', e => {
          const t = e.target;
          if (t.dataset.h !== undefined) { cardState.header[t.dataset.h] = t.value; cardSave(); return; }
          if (t.dataset.t !== undefined) {
            const key = t.dataset.t;
            const v = t.isContentEditable ? t.innerText : t.value;
            if (key === 'final') cardState.teacher.final = v;
            else { const m = key.match(/^([dcs])(\d+)$/); if (m && cardState.teacher.rows[+m[2]]) cardState.teacher.rows[+m[2]][m[1]] = v; }
            cardSave(); return;
          }
          if (t.dataset.r === undefined) return;
          const idx = +t.dataset.r, f = t.dataset.f;
          const row = cardState.rows[idx];
          if (t.dataset.s !== undefined) {
            const s = +t.dataset.s;
            if (f === 'ratio') row.stages[s].ratio = t.value;
            else if (f && f.startsWith('pct-')) row.stages[s].pct[f.slice(4)] = t.value;
          } else if (t.isContentEditable) {
            row[f] = t.innerText;
            if (f === 'exam') cardUpdateConflicts(idx);
          } else {
            row[f] = t.value;
            if (t.classList.contains('card-ac')) { cardAcFor(t); cardTryAutofill(idx, f); }
          }
          cardSave();
        });
        panel.addEventListener('focusout', e => {
          const t = e.target;
          if (t.classList && t.classList.contains('card-ac') && t.dataset.r !== undefined) cardTryAutofill(+t.dataset.r);
          if (t.dataset && t.dataset.f === 'exam') cardUpdateConflicts();
        });
        panel.addEventListener('focusin', e => {
          const t = e.target;
          if (t.classList && t.classList.contains('card-ac')) cardAcFor(t);
        });
        panel.addEventListener('click', e => {
          const oxEl = e.target.closest('.card-ox');
          if (oxEl) {
            const k = oxEl.dataset.ox;
            const cur = cardState.header[k] || '';
            const nxt = cur === '' ? 'O' : (cur === 'O' ? 'X' : '');
            cardState.header[k] = nxt;
            oxEl.textContent = nxt;
            cardSave();
            return;
          }
          const strat = e.target.closest('.card-strat');
          if (strat) {
            const idx = +strat.dataset.r;
            cardState.rows[idx].strategy = cardState.rows[idx].strategy === strat.dataset.strat ? '' : strat.dataset.strat;
            cardRenderRow(idx);
            cardSave();
            return;
          }
          const clr = e.target.closest('.card-clear-row');
          if (clr && confirm((+clr.dataset.clear + 1) + '번 행을 지울까요?')) cardClearRow(+clr.dataset.clear);
        });
        panel.addEventListener('keydown', e => {
          if (e.key === 'Escape') cardAcHide();
          if (e.target.classList && e.target.classList.contains('card-ac')) {
            const box = el('cardAcBox');
            const open = box && box.style.display === 'block';
            if (!open) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
              // ↑↓ 키로 목록 탐색 (선택 항목이 보이도록 자동 스크롤)
              e.preventDefault();
              const items = Array.from(box.querySelectorAll('.card-ac-item'));
              if (!items.length) return;
              let i = items.findIndex(it => it.classList.contains('active'));
              i = e.key === 'ArrowDown' ? (i < items.length - 1 ? i + 1 : 0) : (i <= 0 ? items.length - 1 : i - 1);
              items.forEach(it => it.classList.remove('active'));
              items[i].classList.add('active');
              items[i].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter') {
              const pick = box.querySelector('.card-ac-item.active') || box.querySelector('.card-ac-item');
              if (pick) { e.preventDefault(); pick.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })); }
            }
          }
        });
        cardRefreshAll();
      }
    }
    function cardRefreshAll() {
      const h = cardState.header;
      el('cardPanel').querySelectorAll('input[data-h]').forEach(i2 => { i2.value = h[i2.dataset.h] || ''; });
      el('cardPanel').querySelectorAll('[data-ox]').forEach(s => { s.textContent = h[s.dataset.ox] || ''; });
      const tch = cardState.teacher || { rows: [], final: '' };
      el('cardPanel').querySelectorAll('[data-t]').forEach(n => {
        const key = n.dataset.t;
        let v = '';
        if (key === 'final') v = tch.final || '';
        else { const m = key.match(/^([dcs])(\d+)$/); if (m && tch.rows[+m[2]]) v = tch.rows[+m[2]][m[1]] || ''; }
        if (n.isContentEditable) n.innerText = v; else n.value = v;
      });
      for (let i = 0; i < CARD_ROWS; i++) cardRenderRow(i);
      renderAnalysis();
    }
    // ==================== /상담카드 탭 ====================

  // 3단계: 대학 목록·고사일을 먼저 받은 뒤 카드를 그린다
  setStatus('대학 목록과 고사일 자료를 불러오는 중…');
  call('getBoot').then(b => {
    BOOT = b || { unis: [] };
    CARD_SCHED = typeof BOOT.sched === 'string' ? JSON.parse(BOOT.sched) : (BOOT.sched || []);
    setStatus('');
  }).catch(err => {
    setStatus((err && err.message ? err.message : err) + ' (자동 채움 없이 직접 입력만 가능)', true);
  }).then(() => {
    renderCard();
    const ib = el('cardImportBtn'); if (ib) ib.style.display = 'none';
  });
})();
</script>
</body>
</html>
